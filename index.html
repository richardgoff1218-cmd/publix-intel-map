    function getCurrentBusynessScore(store) {
      const now = new Date();
      const hour = now.getHours();
      const isWeekend = (now.getDay() === 0 || now.getDay() === 6);
      let score = 4;
      if (isWeekend) {
        if (hour >= 8 && hour < 11) score = 6;
        else if (hour >= 11 && hour < 14) score = 8;
        else if (hour >= 14 && hour < 18) score = 9;
        else if (hour >= 18 && hour < 20) score = 7;
        else if (hour >= 20) score = 4;
        else score = 3;
      } else {
        if (hour >= 6 && hour < 8) score = 5;
        else if (hour >= 8 && hour < 10) score = 6;
        else if (hour >= 10 && hour < 12) score = 5;
        else if (hour >= 11 && hour < 14) score = 7;
        else if (hour >= 14 && hour < 16) score = 4;
        else if (hour >= 16 && hour < 19) score = 9;
        else if (hour >= 19 && hour < 21) score = 7;
        else if (hour >= 21) score = 3;
        else score = 2;
      }
      const variance = (parseInt(store.id.slice(-1), 16) % 5) - 2;
      return Math.max(1, Math.min(10, Math.round(score + variance)));
    }

    function getBusynessLabel(score) {
      if (score <= 3) return {label:"Low", cls:"busyness-low"};
      if (score <= 5) return {label:"Moderate", cls:"busyness-low"};
      if (score <= 7) return {label:"Medium", cls:"busyness-medium"};
      if (score <= 8) return {label:"High", cls:"busyness-high"};
      return {label:"Very busy", cls:"busyness-veryhigh"};
    }

    function getOpportunityScore(store) {
      const busyness = getCurrentBusynessScore(store);
      return ((10 - busyness) * 1.7) + (store.medianIncome / 28000);
    }

    function initMap() {
      map = L.map('map', {zoomControl: false, attributionControl: false}).setView([28.8, -82.0], 8);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    }

    function createMarker(store) {
      const score = getCurrentBusynessScore(store);
      const bus = getBusynessLabel(score);
      const icon = L.divIcon({
        className: `store-marker w-7 h-7 rounded-full border-[3px] border-white shadow-lg`,
        html: `<div class="w-6 h-6 rounded-full ${bus.cls} flex items-center justify-center text-[9px] font-bold text-white">${score}</div>`,
        iconSize: [28, 28],
        iconAnchor: [14, 14]
      });
      const marker = L.marker([store.lat, store.lng], {icon}).addTo(map);
      
      const popupHtml = `
        <div style="min-width:240px; padding:10px 12px; font-size:13px; line-height:1.35">
          <div style="font-weight:600; font-size:15px; margin-bottom:4px;">${store.name}</div>
          <div style="color:#64748b; font-size:12px; margin-bottom:6px;">${store.address}</div>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <div><span style="font-weight:600; color:#0f172a">${score}/10</span> <span style="font-size:11px; color:#64748b">${bus.label}</span></div>
            <div style="font-weight:600; color:#10b981">$${store.medianIncome.toLocaleString()}</div>
          </div>
          <div style="display:flex; gap:6px; margin-top:8px">
            <button onclick="window.open('https://www.google.com/maps/@${store.lat},${store.lng},16z/data=!5m1!1e1','_blank')" style="flex:1; padding:6px 10px; background:#0f172a; color:white; border:none; border-radius:8px; font-size:12px; cursor:pointer">Live Traffic</button>
            <button onclick="window.open('https://www.google.com/search?q=${encodeURIComponent(store.name + ' busy times')}', '_blank')" style="flex:1; padding:6px 10px; background:#64748b; color:white; border:none; border-radius:8px; font-size:12px; cursor:pointer">Popular Times</button>
          </div>
          <div style="margin-top:8px; text-align:center">
            <button onclick="showStoreDetail('${store.id}')" style="font-size:12px; color:#10b981; background:none; border:none; cursor:pointer; text-decoration:underline">More details + edit</button>
          </div>
        </div>
      `;
      marker.bindPopup(popupHtml, {closeButton: true, offset: [0, -8]});
      markers[store.id] = marker;
      return marker;
    }

    function renderAreaFilters() {
      const container = document.getElementById('area-filters');
      container.innerHTML = '';
      const areas = [
        {key:'all', label:'All Regions'},
        {key:'gainesville', label:'Gainesville'},
        {key:'villages', label:'The Villages / Lady Lake'},
        {key:'ocala', label:'Ocala / Belleview'},
        {key:'leesburg', label:'Leesburg / Eustis / Mt Dora'},
        {key:'orlando', label:'Orlando + Kissimmee'},
        {key:'tampa', label:'Tampa Bay'}
      ];
      areas.forEach(a => {
        const btn = document.createElement('button');
        btn.textContent = a.label;
        btn.className = `area-filter px-3 py-1 text-xs rounded-2xl border border-slate-700 ${currentFilter === a.key ? 'active' : ''}`;
        btn.onclick = () => {
          currentFilter = a.key;
          renderAreaFilters();
          renderStoresList();
          renderRecommended();
        };
        container.appendChild(btn);
      });
    }

    function renderStoresList() {
      const container = document.getElementById('stores-list');
      container.innerHTML = '';
      let filtered = stores;
      if (currentFilter !== 'all') filtered = stores.filter(s => s.area === currentFilter);
      const sorted = filtered.sort((a, b) => getOpportunityScore(b) - getOpportunityScore(a));
      document.getElementById('store-count').textContent = `(${filtered.length})`;
      sorted.forEach(store => {
        const score = getCurrentBusynessScore(store);
        const bus = getBusynessLabel(score);
        const income = store.medianIncome.toLocaleString();
        const el = document.createElement('div');
        el.className = `store-row px-4 py-3 flex items-center gap-3 cursor-pointer`;
        el.innerHTML = `<div class="flex-shrink-0 w-8 h-8 rounded-2xl ${bus.cls} flex items-center justify-center text-white text-sm font-bold shadow-sm">${score}</div><div class="min-w-0 flex-1"><div class="font-semibold leading-tight truncate">${store.name}</div><div class="text-[11px] text-slate-400 truncate">${store.address}</div></div><div class="text-right text-xs"><div class="font-mono font-semibold text-emerald-400">$${income}</div><div class="text-[10px] text-slate-500">median</div></div>`;
        el.onclick = () => {
          const marker = markers[store.id];
          if (marker) {
            map.flyTo([store.lat, store.lng], 15, { duration: 0.85 });
            setTimeout(() => marker.openPopup(), 900);
          }
        };
        container.appendChild(el);
      });
    }

    function renderRecommended() {
      const container = document.getElementById('recommended-list');
      container.innerHTML = '';
      let filtered = stores;
      if (currentFilter !== 'all') filtered = stores.filter(s => s.area === currentFilter);
      const sorted = filtered.sort((a, b) => getOpportunityScore(b) - getOpportunityScore(a)).slice(0, 6);
      sorted.forEach(store => {
        const bus = getBusynessLabel(getCurrentBusynessScore(store));
        const div = document.createElement('div');
        div.className = `flex items-center justify-between px-3 py-2 bg-slate-950 rounded-2xl cursor-pointer hover:bg-slate-900`;
        div.innerHTML = `<div class="flex items-center gap-x-2 min-w-0"><div class="w-6 h-6 rounded-xl ${bus.cls} flex-shrink-0 flex items-center justify-center text-[10px] font-bold text-white">${getCurrentBusynessScore(store)}</div><div class="truncate"><div class="font-medium text-sm leading-none truncate">${store.name}</div><div class="text-[10px] text-emerald-400 font-medium">$${Math.round(store.medianIncome/1000)}k</div></div></div><div class="text-xs px-2 py-0.5 rounded-xl bg-slate-800 text-slate-300 font-medium">View</div>`;
        div.onclick = () => {
          const marker = markers[store.id];
          if (marker) {
            map.flyTo([store.lat, store.lng], 15, { duration: 0.85 });
            setTimeout(() => marker.openPopup(), 900);
          }
        };
        container.appendChild(div);
      });
    }

    function refreshAllBusyness() {
      Object.values(markers).forEach(m => map.removeLayer(m));
      markers = {};
      stores.forEach(s => createMarker(s));
      renderStoresList();
      renderRecommended();
    }

    function showStoreDetail(id) {
      const store = stores.find(s => s.id === id);
      if (!store) return;
      const score = getCurrentBusynessScore(store);
      const bus = getBusynessLabel(score);
      const html = `<div style="padding:12px 14px; min-width:240px; font-size:13px"><div style="font-weight:600; font-size:15px; margin-bottom:2px">${store.name}</div><div style="color:#64748b; font-size:12px; line-height:1.3; margin-bottom:8px">${store.address}</div><div style="display:flex; justify-content:space-between; margin-bottom:8px"><div><span style="font-weight:600">${score}/10</span> <span style="color:#64748b">${bus.label}</span></div><div style="font-weight:600; color:#10b981">$${store.medianIncome.toLocaleString()}</div></div><button onclick="window.open('https://www.google.com/maps/@${store.lat},${store.lng},16z/data=!5m1!1e1','_blank')" style="width:100%; padding:7px; background:#0f172a; color:white; border:none; border-radius:8px; font-size:12px; margin-bottom:6px; cursor:pointer">View LIVE Traffic</button><div style="display:flex; gap:6px"><button onclick="window.open('https://www.google.com/search?q=${encodeURIComponent(store.name + ' busy times')}', '_blank')" style="flex:1; padding:6px; background:#64748b; color:white; border:none; border-radius:8px; font-size:12px; cursor:pointer">Popular Times</button><button onclick="window.open('https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${store.lat},${store.lng}', '_blank')" style="flex:1; padding:6px; background:#64748b; color:white; border:none; border-radius:8px; font-size:12px; cursor:pointer">Street View</button></div><div style="margin-top:10px; font-size:11px; color:#64748b; text-align:center">ZIP ${store.zip} • Data saved locally</div></div>`;
      const marker = markers[id];
      if (marker) {
        marker.bindPopup(html, {closeButton: true, offset: [0, -10]}).openPopup();
      }
    }

    function showAddModal() {
      const addr = prompt('Paste full address or Google Maps link:');
      if (!addr) return;
      const name = prompt('Store name (optional):', 'New Publix') || 'Publix Store';
      const zip = prompt('ZIP code:', '') || '';
      const inc = parseInt(prompt('Median HH income (optional):', '75000') || '75000');
      fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(addr)}&limit=1`)
        .then(r => r.json())
        .then(data => {
          if (data && data[0]) {
            const newStore = {id: 's' + Date.now(), name, address: addr, lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon), zip, medianIncome: inc, area: 'orlando'};
            stores.push(newStore);
            localStorage.setItem('publix-central-fl', JSON.stringify(stores));
            createMarker(newStore);
            renderStoresList();
            renderRecommended();
            map.flyTo([newStore.lat, newStore.lng], 15, {duration: 0.9});
            setTimeout(() => { if (markers[newStore.id]) markers[newStore.id].openPopup(); }, 950);
          } else alert('Could not locate. Try a more specific address.');
        });
    }

    function resetToDefaults() {
      if (!confirm('Reset to the full default list?')) return;
      localStorage.removeItem('publix-central-fl');
      location.reload();
    }

    function updateClock() {
      const el = document.getElementById('current-time');
      const tick = () => el.textContent = new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
      tick();
      setInterval(tick, 30000);
    }

    function loadStores() {
      const saved = localStorage.getItem('publix-central-fl');
      stores = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(defaultStores));
    }

    function initialize() {
      loadStores();
      initMap();
      stores.forEach(s => createMarker(s));
      renderAreaFilters();
      renderStoresList();
      renderRecommended();
      updateClock();
      setTimeout(() => {
        const g = L.featureGroup(Object.values(markers));
        map.fitBounds(g.getBounds().pad(0.08));
      }, 900);
    }

    window.onload = initialize;
  </script>
</body>
</html>
