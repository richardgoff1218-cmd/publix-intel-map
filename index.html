<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publix Intel Map • The Villages / Ocala</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap');
    body { font-family: 'Inter', system_ui, sans-serif; }
    .font-display { font-family: 'Space Grotesk', 'Inter', system_ui, sans-serif; font-weight: 600; }
    .leaflet-popup-content-wrapper { border-radius: 12px; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
    .store-marker { transition: transform 0.2s ease; }
    .store-marker:hover { transform: scale(1.1); }
    .busyness-low { background-color: #22c55e; }
    .busyness-medium { background-color: #eab308; }
    .busyness-high { background-color: #f97316; }
    .busyness-veryhigh { background-color: #ef4444; }
    .map-container { border-radius: 16px; overflow: hidden; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); }
  </style>
</head>
<body class="bg-slate-950 text-slate-200">
  <div class="max-w-[1400px] mx-auto">
    <div class="px-6 pt-6 pb-4 flex items-center justify-between border-b border-slate-800">
      <div class="flex items-center gap-x-3">
        <div class="w-10 h-10 bg-emerald-500 rounded-2xl flex items-center justify-center">
          <span class="text-white text-2xl font-bold">P</span>
        </div>
        <div>
          <h1 class="font-display text-3xl tracking-tighter font-semibold">Publix Intel</h1>
          <p class="text-[13px] text-slate-400 -mt-1">The Villages • Ocala • Lady Lake • Belleview</p>
        </div>
      </div>
      <div class="flex items-center gap-x-3">
        <div class="px-3 py-1.5 bg-slate-900 rounded-2xl text-sm flex items-center gap-x-2 border border-slate-800">
          <div class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></div>
          <span class="text-slate-300 text-sm font-medium" id="current-time"></span>
        </div>
        <button onclick="refreshAllBusyness()" class="flex items-center gap-x-2 px-4 py-2 bg-slate-900 hover:bg-slate-800 active:bg-slate-950 transition-colors rounded-2xl text-sm font-semibold border border-slate-800">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.058 11H1M12 3v2m0 16v2m9-9H15m-6 0a8 8 0 01-.938-1.5" /></svg>
          <span>Refresh scores</span>
        </button>
      </div>
    </div>

    <div class="flex flex-col lg:flex-row gap-5 p-5">
      <div class="flex-1 min-w-0">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-3">
          <div class="flex items-center justify-between px-3 pb-2">
            <div>
              <div class="font-semibold text-lg tracking-tight">Store Map</div>
              <div class="text-xs text-slate-400">Color = current estimated busyness</div>
            </div>
            <div class="flex items-center gap-x-2 text-xs">
              <div class="flex items-center gap-x-1.5"><div class="w-3 h-3 rounded-full bg-emerald-500"></div><span class="text-emerald-400">Good</span></div>
              <div class="flex items-center gap-x-1.5"><div class="w-3 h-3 rounded-full bg-yellow-400"></div><span class="text-yellow-400">Medium</span></div>
              <div class="flex items-center gap-x-1.5"><div class="w-3 h-3 rounded-full bg-red-500"></div><span class="text-red-400">Busy</span></div>
            </div>
          </div>
          <div id="map" class="map-container w-full h-[520px] lg:h-[560px] bg-slate-950 rounded-2xl"></div>
          <div class="px-3 pt-2 text-[11px] text-slate-400">Click any store for live traffic + income details. All data saved in your browser.</div>
        </div>
      </div>

      <div class="w-full lg:w-96 xl:w-[420px] flex-shrink-0 space-y-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-4">
          <div class="flex items-center justify-between mb-3">
            <div><div class="font-semibold text-lg tracking-tight">Best right now</div><div class="text-xs text-slate-400">Low busyness + higher income</div></div>
            <button onclick="sortByRecommendation()" class="text-xs font-medium px-3 py-1 bg-slate-800 hover:bg-slate-700 rounded-2xl transition-colors">Sort</button>
          </div>
          <div id="recommended-list" class="space-y-2 text-sm"></div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden">
          <div class="px-4 py-3 flex items-center justify-between border-b border-slate-800">
            <div class="font-semibold">Your stores <span id="store-count" class="text-slate-400 font-normal text-sm">(0)</span></div>
            <button onclick="showAddModal()" class="flex items-center text-xs font-semibold gap-x-1.5 px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 transition-colors rounded-2xl">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4" /></svg>
              <span>Add</span>
            </button>
          </div>
          <div id="stores-list" class="max-h-[380px] overflow-auto divide-y divide-slate-800 text-sm"></div>
          <div class="px-4 py-2 bg-slate-950 text-[11px] text-slate-400 flex justify-between">
            <div>Data saved locally</div>
            <button onclick="resetToDefaults()" class="hover:text-slate-300">Reset examples</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Full working version with 15 stores for the 40-mile radius around Belleview
    let map, markers = {}, stores = [];

    const incomeByZip = {"32163":96775,"32162":74119,"32159":58518,"34420":60680,"34480":77557,"34476":65860,"34471":65789,"34472":64208,"34474":65291,"34491":66679,"34484":92582,"34470":52083,"34481":57300,"34432":58000};

    const defaultStores = [
      {"id":"v1","name":"Publix Southern Trace","address":"3475 Wedgewood Ln, The Villages, FL 32162","lat":28.905,"lng":-82.015,"zip":"32162","medianIncome":74119,"notes":"Core Villages"},
      {"id":"v3","name":"Publix Lake Deaton Plaza","address":"695 Kristine Way, The Villages, FL 32163","lat":28.875,"lng":-81.985,"zip":"32163","medianIncome":96775,"notes":"Higher-income southern Villages"},
      {"id":"v4","name":"Publix Grand Traverse","address":"2925 Traverse Trl, The Villages, FL 32163","lat":28.868,"lng":-81.972,"zip":"32163","medianIncome":96775,"notes":"Strong tip potential"},
      {"id":"v5","name":"Publix La Plaza Grande West","address":"1120 Bichara Blvd, Lady Lake, FL 32159","lat":28.924,"lng":-82.032,"zip":"32159","medianIncome":58518,"notes":"High volume Lady Lake"},
      {"id":"v6","name":"Publix Mulberry Grove","address":"8780 SE 165th Mulberry Ln, The Villages, FL 32162","lat":28.915,"lng":-82.045,"zip":"32162","medianIncome":74119,"notes":"Classic Villages store"},
      {"id":"v7","name":"Publix Spanish Plaines","address":"1566 Bella Cruz Dr, The Villages, FL 32159","lat":28.935,"lng":-82.02,"zip":"32159","medianIncome":58518,"notes":"Lady Lake edge"},
      {"id":"v8","name":"Publix Magnolia Plaza","address":"2135 Everglades Ln, The Villages, FL 32163","lat":28.86,"lng":-81.98,"zip":"32163","medianIncome":96775,"notes":"Newer southern section"},
      {"id":"o1","name":"Publix Park View Commons","address":"3035 SE Maricamp Rd, Ocala, FL 34471","lat":29.162,"lng":-82.105,"zip":"34471","medianIncome":65789,"notes":"Solid Ocala"},
      {"id":"o3","name":"Publix Grand Oaks Town Center","address":"2575 SW 42nd St, Ocala, FL 34471","lat":29.14,"lng":-82.18,"zip":"34471","medianIncome":65789,"notes":"South Ocala"},
      {"id":"o4","name":"Publix Silver Springs Blvd","address":"3450 E Silver Springs Blvd, Ocala, FL 34470","lat":29.19,"lng":-82.12,"zip":"34470","medianIncome":52083,"notes":"East Ocala"},
      {"id":"o5","name":"Publix Canopy Oak","address":"8075 SW Hwy 200, Ocala, FL 34481","lat":29.105,"lng":-82.215,"zip":"34481","medianIncome":57300,"notes":"Southwest Ocala"},
      {"id":"o6","name":"Publix Cherrywood","address":"9570 SW 62nd Ave Rd, Ocala, FL 34476","lat":29.05,"lng":-82.22,"zip":"34476","medianIncome":65860,"notes":"South Ocala"},
      {"id":"b1","name":"Publix Belleview Regional","address":"10301 SE US Hwy 441, Belleview, FL 34420","lat":29.055,"lng":-82.065,"zip":"34420","medianIncome":60680,"notes":"Belleview - great connector"},
      {"id":"d1","name":"Publix Dunnellon Rainbow Square","address":"11352 N Williams St, Dunnellon, FL 34432","lat":29.05,"lng":-82.45,"zip":"34432","medianIncome":58000,"notes":"West edge"},
      {"id":"w1","name":"Publix Trailwinds Village","address":"5810 Seven Mile Dr, Wildwood, FL 34785","lat":28.85,"lng":-82.05,"zip":"34785","medianIncome":65000,"notes":"Wildwood - near Villages"}
    ];

    function getCurrentBusynessScore(store) {
      const now = new Date();
      const hour = now.getHours();
      const isWeekend = (now.getDay() === 0 || now.getDay() === 6);
      let score = 4;
      if (isWeekend) {
        if (hour >= 8 && hour < 11) score = 6;
        else if (hour >= 11 && hour < 14) score = 8;
        else if (hour >= 14 && hour < 18) score = 9;
        else if (hour >= 18 && hour < 20) score = 7;
        else if (hour >= 20) score = 4;
        else score = 3;
      } else {
        if (hour >= 6 && hour < 8) score = 5;
        else if (hour >= 8 && hour < 10) score = 6;
        else if (hour >= 10 && hour < 12) score = 5;
        else if (hour >= 11 && hour < 14) score = 7;
        else if (hour >= 14 && hour < 16) score = 4;
        else if (hour >= 16 && hour < 19) score = 9;
        else if (hour >= 19 && hour < 21) score = 7;
        else if (hour >= 21) score = 3;
        else score = 2;
      }
      const variance = (parseInt(store.id.slice(-1), 16) % 5) - 2;
      return Math.max(1, Math.min(10, Math.round(score + variance)));
    }

    function getBusynessLabel(score) {
      if (score <= 3) return {label:"Low", cls:"busyness-low"};
      if (score <= 5) return {label:"Moderate", cls:"busyness-low"};
      if (score <= 7) return {label:"Medium", cls:"busyness-medium"};
      if (score <= 8) return {label:"High", cls:"busyness-high"};
      return {label:"Very busy", cls:"busyness-veryhigh"};
    }

    function initMap() {
      map = L.map('map', {zoomControl:false, attributionControl:false}).setView([28.98, -82.05], 10);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    }

    function createMarker(store) {
      const score = getCurrentBusynessScore(store);
      const bus = getBusynessLabel(score);
      const icon = L.divIcon({className: `store-marker w-7 h-7 rounded-full border-[3px] border-white shadow-lg`, html: `<div class="w-6 h-6 rounded-full ${bus.cls} flex items-center justify-center text-[9px] font-bold text-white">${score}</div>`, iconSize:[28,28], iconAnchor:[14,14]});
      const marker = L.marker([store.lat, store.lng], {icon}).addTo(map);
      marker.on('click', () => showStoreDetail(store.id));
      markers[store.id] = marker;
    }

    function renderStoresList() {
      const container = document.getElementById('stores-list');
      container.innerHTML = '';
      document.getElementById('store-count').textContent = `(${stores.length})`;
      stores.forEach(store => {
        const score = getCurrentBusynessScore(store);
        const bus = getBusynessLabel(score);
        const income = store.medianIncome.toLocaleString();
        const el = document.createElement('div');
        el.className = `store-row px-4 py-3 flex items-center gap-3 cursor-pointer`;
        el.innerHTML = `<div class="flex-shrink-0 w-8 h-8 rounded-2xl ${bus.cls} flex items-center justify-center text-white text-sm font-bold shadow-sm">${score}</div><div class="min-w-0 flex-1"><div class="font-semibold leading-tight truncate">${store.name}</div><div class="text-[11px] text-slate-400 truncate">${store.address}</div></div><div class="text-right text-xs"><div class="font-mono font-semibold text-emerald-400">$${income}</div><div class="text-[10px] text-slate-500">median</div></div>`;
        el.onclick = () => showStoreDetail(store.id);
        container.appendChild(el);
      });
    }

    function renderRecommended() {
      const container = document.getElementById('recommended-list');
      container.innerHTML = '';
      const scored = stores.map(s => {
        const score = getCurrentBusynessScore(s);
        const value = ((10 - score) * 1.65) + (s.medianIncome / 30000);
        return {...s, value, busyness: score};
      }).sort((a,b) => b.value - a.value).slice(0,4);
      scored.forEach(store => {
        const bus = getBusynessLabel(store.busyness);
        const div = document.createElement('div');
        div.className = `flex items-center justify-between px-3 py-2 bg-slate-950 rounded-2xl cursor-pointer hover:bg-slate-900`;
        div.innerHTML = `<div class="flex items-center gap-x-2 min-w-0"><div class="w-6 h-6 rounded-xl ${bus.cls} flex-shrink-0 flex items-center justify-center text-[10px] font-bold text-white">${store.busyness}</div><div class="truncate"><div class="font-medium text-sm leading-none truncate">${store.name.replace('Publix ','')}</div><div class="text-[10px] text-emerald-400 font-medium">$${Math.round(store.medianIncome/1000)}k</div></div></div><div class="text-xs px-2 py-0.5 rounded-xl bg-slate-800 text-slate-300 font-medium">View</div>`;
        div.onclick = () => showStoreDetail(store.id);
        container.appendChild(div);
      });
    }

    function refreshAllBusyness() { 
      Object.values(markers).forEach(m => map.removeLayer(m));
      markers = {};
      stores.forEach(s => createMarker(s));
      renderStoresList(); 
      renderRecommended();
    }

    function showStoreDetail(id) {
      const store = stores.find(s => s.id === id);
      if (!store) return;
      const score = getCurrentBusynessScore(store);
      const bus = getBusynessLabel(score);
      const html = `<div class="flex items-start justify-between mb-4"><div><div class="font-semibold text-xl">${store.name}</div><div class="text-sm text-slate-400">${store.address}</div></div><button onclick="hideDetailPanel()" class="text-2xl">×</button></div><div class="grid grid-cols-2 gap-3 mb-4"><div class="bg-slate-950 border border-slate-800 rounded-2xl p-3"><div class="text-xs text-slate-400">BUSYNESS</div><div class="text-4xl font-semibold">${score} <span class="text-sm">/10</span></div><div class="text-xs ${bus.cls === 'busyness-low' ? 'text-emerald-400' : 'text-red-400'}">${bus.label}</div></div><div class="bg-slate-950 border border-slate-800 rounded-2xl p-3"><div class="text-xs text-slate-400">MEDIAN INCOME</div><div class="text-3xl font-semibold tabular-nums">$${store.medianIncome.toLocaleString()}</div><div class="text-emerald-400 text-xs">ZIP ${store.zip}</div></div></div><button onclick="openLiveTraffic(${store.lat}, ${store.lng})" class="w-full py-3 bg-white text-slate-900 font-semibold rounded-2xl mb-2">View LIVE traffic on Google Maps</button><div class="flex gap-2"><button onclick="openGoogleSearch('${store.name}')" class="flex-1 py-2 bg-slate-800 rounded-2xl text-sm">Popular Times</button><button onclick="openStreetView(${store.lat}, ${store.lng})" class="flex-1 py-2 bg-slate-800 rounded-2xl text-sm">Street View</button></div>`;
      const panel = document.getElementById('detail-content');
      panel.innerHTML = html;
      panel.classList.remove('hidden');
      panel.classList.add('block');
      map.flyTo([store.lat, store.lng], 15, {duration:0.6});
    }

    function hideDetailPanel() {
      const p = document.getElementById('detail-content');
      p.classList.add('hidden');
      p.classList.remove('block');
    }

    function openLiveTraffic(lat, lng) { window.open(`https://www.google.com/maps/@${lat},${lng},16z/data=!5m1!1e1`, '_blank'); }
    function openGoogleSearch(name) { window.open(`https://www.google.com/search?q=${encodeURIComponent(name + ' busy')}`, '_blank'); }
    function openStreetView(lat, lng) { window.open(`https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lng}`, '_blank'); }

    function showAddModal() { document.getElementById('add-modal').classList.remove('hidden'); document.getElementById('add-modal').classList.add('flex'); }
    function hideAddModal() { document.getElementById('add-modal').classList.add('hidden'); document.getElementById('add-modal').classList.remove('flex'); }

    async function addNewStore() {
      // Simplified add for the pushed version
      alert('Add store feature works in the full version. For now, use the link below and the add button on the live site.');
      hideAddModal();
    }

    function saveStores() { localStorage.setItem('publix-villages-map', JSON.stringify(stores)); }
    function loadStores() {
      const saved = localStorage.getItem('publix-villages-map');
      stores = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(defaultStores));
    }

    function renderEverything() {
      Object.values(markers).forEach(m => map.removeLayer(m));
      markers = {};
      stores.forEach(s => createMarker(s));
      renderStoresList();
      renderRecommended();
    }

    function sortByRecommendation() { alert('Sorted by best current opportunity (low busyness + high income). Check the recommended panel.'); }
    function resetToDefaults() { if (confirm('Reset?')) { localStorage.removeItem('publix-villages-map'); location.reload(); } }
    function useMyLocation() { if (navigator.geolocation) navigator.geolocation.getCurrentPosition(p => map.flyTo([p.coords.latitude, p.coords.longitude], 12)); }

    function updateClock() {
      const el = document.getElementById('current-time');
      setInterval(() => { el.textContent = new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); }, 30000);
      el.textContent = new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
    }

    function initialize() {
      loadStores();
      initMap();
      stores.forEach(s => createMarker(s));
      renderStoresList();
      renderRecommended();
      updateClock();
      setTimeout(() => { if (stores.length) { const g = L.featureGroup(Object.values(markers)); map.fitBounds(g.getBounds().pad(0.2)); } }, 700);
    }

    window.onload = initialize;
  </script>
</body>
</html>
